<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Café de Especialidad</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        :root {
            --primary: #6F4E37; /* Color Café Moderno */
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #1E293B;
            --border: #E2E8F0;
        }

        body { 
            background-color: var(--bg); 
            color: var(--text); 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            padding: 20px; 
            line-height: 1.6;
        }

        .container { max-width: 1000px; margin: auto; }
        
        header { text-align: center; margin-bottom: 40px; }
        h1 { font-size: 2rem; font-weight: 600; color: var(--primary); margin-bottom: 10px; }
        .status { font-size: 0.85rem; color: #64748B; text-transform: uppercase; letter-spacing: 1px; }

        /* NAVEGACIÓN MINIMALISTA */
        .tabs { 
            display: flex; 
            justify-content: center; 
            gap: 10px; 
            margin-bottom: 30px; 
            background: #EDF2F7; 
            padding: 5px; 
            border-radius: 12px;
        }
        .tab-btn {
            background: transparent; border: none; padding: 10px 20px;
            font-family: inherit; font-weight: 600; color: #718096;
            cursor: pointer; border-radius: 8px; transition: all 0.3s;
        }
        .tab-btn.active { background: var(--card); color: var(--primary); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }

        /* FILTROS */
        .filters-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 15px; 
            margin-bottom: 25px; 
        }
        select, input[type="text"] {
            width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border);
            font-family: inherit; font-size: 1rem; outline: none; background: var(--card);
            transition: border 0.3s;
        }
        select:focus, input:focus { border-color: var(--primary); }

        .btn-gps {
            grid-column: span 2; background: var(--primary); color: white; border: none;
            padding: 15px; border-radius: 12px; font-weight: 600; cursor: pointer; transition: opacity 0.3s;
        }
        .btn-gps:hover { opacity: 0.9; }

        /* TARJETAS DE RESULTADOS */
        .results-grid { display: grid; gap: 15px; }
        .cafe-card {
            background: var(--card); border-radius: 16px; padding: 20px;
            border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            display: flex; justify-content: space-between; align-items: center;
        }
        .cafe-info h3 { margin: 0; font-size: 1.1rem; color: var(--text); }
        .cafe-info p { margin: 5px 0 0; font-size: 0.9rem; color: #64748B; }
        
        .actions { display: flex; gap: 8px; }
        .btn-action {
            background: #F1F5F9; color: var(--text); text-decoration: none;
            padding: 8px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: 600;
            transition: all 0.2s;
        }
        .btn-action:hover { background: var(--primary); color: white; }

        #map { 
            height: 500px; width: 100%; border-radius: 20px; border: 1px solid var(--border);
            margin-bottom: 20px; box-shadow: 0 10px 15px rgba(0,0,0,0.05);
        }

        .hidden { display: none; }
        .top-mark { color: #D97706; font-weight: bold; font-size: 0.75rem; text-transform: uppercase; }

        @media (max-width: 600px) {
            .filters-grid { grid-template-columns: 1fr; }
            .cafe-card { flex-direction: column; align-items: flex-start; gap: 15px; }
            .actions { width: 100%; justify-content: space-between; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Buscador de Café</h1>
        <div class="status" id="status">Cargando base de datos...</div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('lista', this)">Listado</button>
        <button class="tab-btn" onclick="switchTab('mapa', this)">Mapa Federal</button>
    </div>

    <div id="tab-lista">
        <div class="filters-grid">
            <select id="select-ciudad" onchange="filtrar()">
                <option value="Todas">Todas las ciudades</option>
                <option value="Mar del Plata">Mar del Plata</option>
                <option value="Buenos Aires">Buenos Aires</option>
                <option value="La Plata">La Plata</option>
                <option value="Córdoba">Córdoba</option>
                <option value="Rosario">Rosario</option>
                <option value="Mendoza">Mendoza</option>
                <option value="Bahía Blanca">Bahía Blanca</option>
                <option value="Top Sudamérica">Top Sudamérica</option>
            </select>
            <input type="text" id="input-busqueda" placeholder="Buscar local o calle..." onkeyup="filtrar()">
            <button class="btn-gps" onclick="activarGPS()">📍 Buscar cafeterías cerca mío</button>
        </div>

        <div id="resultados" class="results-grid">
            </div>
    </div>

    <div id="tab-mapa" class="hidden">
        <div id="map"></div>
    </div>
</div>

<script>
    const SHEET_ID = "10vUOhRr7IAXlRrkBphxEP4ApXYBgrnuxJq6G83GnfHI";
    const GIDS = {
        "Mar del Plata": "0", "Buenos Aires": "1296176686", "La Plata": "208452991",
        "Córdoba": "1250014567", "Rosario": "1691979590", "Mendoza": "2031963266",
        "Bahía Blanca": "1634818534", "Top Sudamérica": "35250567"
    };

    let baseDeDatos = [];
    let mapa = L.map('map').setView([-38.41, -63.61], 5);
    let markers = L.layerGroup().addTo(mapa);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(mapa);

    async function init() {
        let count = 0;
        const total = Object.keys(GIDS).length;

        for (const [ciudad, gid] of Object.entries(GIDS)) {
            const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${gid}`;
            Papa.parse(url, {
                download: true, header: true,
                complete: function(results) {
                    results.data.forEach(row => {
                        const nombre = row.CAFE || row.Cafe;
                        if (nombre && row.LAT) {
                            baseDeDatos.push({
                                nombre,
                                ciudad: ciudad === "Top Sudamérica" ? (row.CIUDAD || "Top") : ciudad,
                                ubicacion: row.UBICACION || "",
                                instagram: row.INSTAGRAM || "#",
                                lat: parseFloat(row.LAT.replace(',', '.')),
                                lon: parseFloat(row.LONG.replace(',', '.')),
                                esTop: ciudad === "Top Sudamérica"
                            });
                        }
                    });
                    count++;
                    if (count === total) {
                        document.getElementById('status').innerText = `${baseDeDatos.length} locales disponibles`;
                        render(baseDeDatos);
                    }
                }
            });
        }
    }

    function render(datos) {
        const container = document.getElementById('resultados');
        container.innerHTML = "";
        markers.clearLayers();

        datos.forEach(cafe => {
            // Card UI
            const card = document.createElement('div');
            card.className = 'cafe-card';
            
            let badge = cafe.esTop ? '<span class="top-mark">★ TOP 100</span>' : '';
            let mapsLink = `https://www.google.com/maps?q=${cafe.lat},${cafe.lon}`;

            card.innerHTML = `
                <div class="cafe-info">
                    ${badge}
                    <h3>${cafe.nombre}</h3>
                    <p>${cafe.ubicacion} • ${cafe.ciudad}</p>
                </div>
                <div class="actions">
                    <a href="${cafe.instagram}" target="_blank" class="btn-action">Instagram</a>
                    <a href="${mapsLink}" target="_blank" class="btn-action">Mapa</a>
                </div>
            `;
            container.appendChild(card);

            // Map UI
            L.circleMarker([cafe.lat, cafe.lon], {
                radius: 6, color: cafe.esTop ? '#D97706' : '#6F4E37', fillOpacity: 0.8
            }).addTo(markers).bindPopup(`<b>${cafe.nombre}</b><br>${cafe.ubicacion}`);
        });
    }

    function filtrar() {
        const ciudad = document.getElementById('select-ciudad').value;
        const texto = document.getElementById('input-busqueda').value.toLowerCase();

        const filtrados = baseDeDatos.filter(c => {
            const coincideCiudad = ciudad === "Todas" || c.ciudad === ciudad || (ciudad === "Top Sudamérica" && c.esTop);
            const coincideTexto = c.nombre.toLowerCase().includes(texto) || c.ubicacion.toLowerCase().includes(texto);
            return coincideCiudad && coincideTexto;
        });

        render(filtrados);
    }

    function switchTab(tab, btn) {
        document.getElementById('tab-lista').classList.toggle('hidden', tab !== 'lista');
        document.getElementById('tab-mapa').classList.toggle('hidden', tab !== 'mapa');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if (tab === 'mapa') setTimeout(() => mapa.invalidateSize(), 200);
    }

    function activarGPS() {
        if (!navigator.geolocation) return alert("GPS no soportado");
        document.getElementById('status').innerText = "Localizando...";
        
        navigator.geolocation.getCurrentPosition(pos => {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            
            const cerca = baseDeDatos.map(c => {
                const d = Math.sqrt(Math.pow(lat - c.lat, 2) + Math.pow(lon - c.lon, 2));
                return { ...c, dist: d };
            }).sort((a, b) => a.dist - b.dist).slice(0, 10);
            
            document.getElementById('status').innerText = "Mostrando los 10 más cercanos";
            render(cerca);
        });
    }

    init();
</script>
</body>
</html>
